# WT20 dual boot: the GRUB the firmware starts. It sits on Windows' EFI system partition
# (\EFI\wt20\grubx64.efi, a firmware boot entry added from Windows by prepare-windows.ps1) and
# only decides where to go:
#   - Android is installed (its own EFI partition carries the marker file): hand over to the
#     GRUB there, which shows the Android / Windows menu and is updated with Android;
#   - not installed, and the WT20 installer stick is plugged in (it carries /wt20-auto.cpio, and
#     no /wt20-installed yet): start the stick, which installs by itself. The tablet has one USB
#     port, so with the stick in it nobody can pick it in the firmware's or Windows' menus, and
#     this firmware lists no USB entry to set as the next boot from Windows;
#   - otherwise (not installed yet, removed, or its GRUB cannot be started): Windows.
# Nothing here waits for a key: the tablet has no keyboard.
# "set root" before every chainloader: GRUB hands the started image the ROOT device as its boot
# device, whatever device the file name carries, and Windows Boot Manager looks for its BCD there
# (with root left on this GRUB's memdisk it failed: tablet 2, 2026-11-14).
set timeout=0
set android_esp=
search --file --no-floppy --set=android_esp /boot/grub/.is_esp_part_on_android_boot_device
if [ -n "$android_esp" ]; then
	if [ -f ($android_esp)/EFI/BOOT/BOOTX64.EFI ]; then
		echo 'Android...'
		set root=$android_esp
		chainloader /EFI/BOOT/BOOTX64.EFI
		boot
	fi
fi
set wt20_stick=
search --file --no-floppy --set=wt20_stick /wt20-auto.cpio
if [ -n "$wt20_stick" ]; then
	if [ ! -f ($wt20_stick)/wt20-installed ]; then
		if [ -f ($wt20_stick)/EFI/BOOT/BOOTX64.EFI ]; then
			echo 'Android installer stick...'
			set root=$wt20_stick
			chainloader /EFI/BOOT/BOOTX64.EFI
			boot
		fi
	fi
fi
set windows_esp=
search --file --no-floppy --set=windows_esp /EFI/Microsoft/Boot/bootmgfw.efi
if [ -n "$windows_esp" ]; then
	echo 'Windows...'
	set root=$windows_esp
	chainloader /EFI/Microsoft/Boot/bootmgfw.efi
	boot
fi
echo 'No system found. Turn the tablet off with the power button.'
sleep 30
exit
